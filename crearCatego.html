<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Categoría - Administración</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="crearCatego.css">
</head>
<body>
    <div class="container">
        <div class="main-container">
            <div class="header">
                <h1><i class="fas fa-tag me-3"></i>Crear Nueva Categoría</h1>
                <p class="subtitle">Gestiona las categorías de contenido</p>
            </div>

            <div class="form-container">
                <form id="categoriaForm">
                    <div class="row mb-4">
                        <div class="col-md-8 mb-3">
                            <label class="form-label">
                                <i class="fas fa-heading me-2"></i>Nombre de la categoría
                            </label>
                            <input type="text" class="form-control" placeholder="Ej: Jugadas Destacadas" required>
                        </div>
                        
                    </div>

                    <div class="mb-4">
                        <label class="form-label">
                            <i class="fas fa-align-left me-2"></i>Descripción
                        </label>
                        <textarea class="form-control" rows="3" placeholder="Describe el propósito de esta categoría..." required></textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">
                            <i class="fas fa-futbol me-2"></i>Selecciona un ícono
                        </label>
                        <div class="icon-grid">
                            <div class="icon-option" data-icon="fa-running">
                                <i class="fas fa-running"></i>
                                <span>Jugadas</span>
                            </div>
                            <div class="icon-option" data-icon="fa-microphone">
                                <i class="fas fa-microphone"></i>
                                <span>Entrevistas</span>
                            </div>
                            <div class="icon-option" data-icon="fa-futbol">
                                <i class="fas fa-futbol"></i>
                                <span>Partidos</span>
                            </div>
                            <div class="icon-option" data-icon="fa-chart-bar">
                                <i class="fas fa-chart-bar"></i>
                                <span>Estadísticas</span>
                            </div>
                            <div class="icon-option" data-icon="fa-users">
                                <i class="fas fa-users"></i>
                                <span>Asistentes</span>
                            </div>
                            <div class="icon-option" data-icon="fa-exclamation-triangle">
                                <i class="fas fa-exclamation-triangle"></i>
                                <span>Incidentes</span>
                            </div>
                            <div class="icon-option" data-icon="fa-fire">
                                <i class="fas fa-fire"></i>
                                <span>Polémicas</span>
                            </div>
                            <div class="icon-option" data-icon="fa-map-marker-alt">
                                <i class="fas fa-map-marker-alt"></i>
                                <span>Sedes</span>
                            </div>
                            <div class="icon-option" data-icon="fa-heart">
                                <i class="fas fa-heart"></i>
                                <span>Cultura</span>
                            </div>
                            <div class="icon-option" data-icon="fa-trophy">
                                <i class="fas fa-trophy"></i>
                                <span>Premios</span>
                            </div>
                            <div class="icon-option" data-icon="fa-star">
                                <i class="fas fa-star"></i>
                                <span>Destacados</span>
                            </div>
                            <div class="icon-option" data-icon="fa-history">
                                <i class="fas fa-history"></i>
                                <span>Históricos</span>
                            </div>
                        </div>
                        <input type="hidden" id="selectedIcon" name="icon" required>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                <i class="fas fa-globe me-2"></i>Mundial asociado
                            </label>
                            <select class="form-select">
                                <option value="">Selecciona un mundial (opcional)</option>
                                <option value="2026">Mundial 2026 - USA, Canadá, México</option>
                                <option value="2022">Mundial 2022 - Qatar</option>
                                <option value="2018">Mundial 2018 - Rusia</option>
                                <option value="2014">Mundial 2014 - Brasil</option>
                                <option value="none">Ningún mundial específico</option>
                            </select>
                        </div>
                    </div>

                    

                  <div class="text-center">
                  <a href="Mundiales.php" class="btn btn-secondary me-3">
                  <i class="fas fa-times me-2"></i>Cancelar
                  </a>
                  <button type="submit" class="btn btn-primary">
                  <i class="fas fa-plus me-2"></i>Crear Categoría
                  </button>
                     </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
       
        document.querySelectorAll('.icon-option').forEach(option => {
            option.addEventListener('click', function() {
                document.querySelectorAll('.icon-option').forEach(opt => {
                    opt.classList.remove('selected');
                });
                this.classList.add('selected');
                document.getElementById('selectedIcon').value = this.getAttribute('data-icon');
            });
        });
    </script>
</body>
</html>
